
name: Windows 11 Virtual

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Preparar Windows
        run: |
          systeminfo
          hostname

      - name: Instalar Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_CLIENT_SECRET }}
          tags: tag:ci

      - name: Mostrar conexão
        run: |
          tailscale status
          ipconfig

      - name: Manter sessão
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
          }
        shell: powershell
